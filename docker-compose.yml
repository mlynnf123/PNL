services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jj_roofing
      POSTGRES_PASSWORD: jj_roofing_dev_password
      POSTGRES_DB: jj_roofing_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jj_roofing -d jj_roofing_dev']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
