name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jj_roofing
          POSTGRES_PASSWORD: jj_roofing_test_password
          POSTGRES_DB: jj_roofing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jj_roofing -d jj_roofing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://jj_roofing:jj_roofing_test_password@localhost:5432/jj_roofing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
